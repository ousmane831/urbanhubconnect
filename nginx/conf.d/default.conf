server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ ^/(api|admin)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/(sitemap\.xml|robots\.txt)$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /static/ { alias /static/; expires 30d; access_log off; }
  location /media/ { alias /media/; expires 7d; }
  location /assets/ { root /usr/share/nginx/html; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}

# HTTPS : une fois le certificat obtenu (ex. Let's Encrypt), ajouter un bloc "listen 443 ssl" avec
# ssl_certificate / ssl_certificate_key, rediriger le port 80 vers https, puis SECURE_SSL_REDIRECT=True.
